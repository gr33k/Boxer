name: Boxer macOS build

on:
  workflow_dispatch:
  push:
    branches: [maddsV2, 'boxer-modern-ci-*']
  pull_request:
    branches: [maddsV2]

permissions:
  contents: read

concurrency:
  group: boxer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned universal Boxer
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CMAKE: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      NCPUS: '2'
      MAKEFLAGS: -e

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Ensure Metal toolchain when separately installed
        run: |
          if xcodebuild -showComponent MetalToolchain -json > "$RUNNER_TEMP/metal-component.json" 2>/dev/null; then
            if ! jq -e '.status == "installed"' "$RUNNER_TEMP/metal-component.json" >/dev/null; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
      - name: Build Boxer
        run: |
          xcodebuild \
            -workspace Boxer.xcworkspace \
            -scheme 'Boxer CI' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BoxerDerivedData" \
            -jobs 2 \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
      - name: Verify universal app bundle
        run: |
          app="$RUNNER_TEMP/BoxerDerivedData/Build/Products/Release/Boxer.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '12.0'
          archs="$(lipo -archs "$app/Contents/MacOS/Boxer")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
